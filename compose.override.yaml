services:
    db:
        ports:
            - '${POSTGRES_PORT:-5432}:5432'

    migrate:
        build:
            target: development
        environment:
            FLASK_DEBUG: '1'
            JWT_COOKIE_SECURE: 'false'
        volumes:
            - ./backend:/app

    backend:
        build:
            target: development
        environment:
            FLASK_DEBUG: '1'
            JWT_COOKIE_SECURE: 'false'
            ENABLE_DEBUG_ROUTES: ${ENABLE_DEBUG_ROUTES:-false}
        ports:
            - '${BACKEND_PORT:-5001}:5000'
        volumes:
            - ./backend:/app
            - ./logs:/app/logs

    frontend:
        build:
            target: development
        environment:
            VITE_API_URL: ${VITE_API_URL:-http://localhost:5001}
        ports:
            - '${FRONTEND_PORT:-3000}:5173'
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules

volumes:
    frontend_node_modules:
