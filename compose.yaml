name: finzen

services:
    db:
        image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        restart: unless-stopped

    migrate:
        build:
            context: .
            dockerfile: backend/Dockerfile
            target: production
        environment: &backend-environment
            FLASK_DEBUG: '0'
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
            CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
            JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
            JWT_COOKIE_CSRF_PROTECT: ${JWT_COOKIE_CSRF_PROTECT:-true}
            JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
            ENABLE_ADMIN: ${ENABLE_ADMIN:-false}
            FLASK_APP_KEY: ${FLASK_APP_KEY:-}
            ADMIN_USERNAME: ${ADMIN_USERNAME:-}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
            ENABLE_DEBUG_ROUTES: 'false'
        command: ['flask', 'db', 'upgrade']
        depends_on:
            db:
                condition: service_healthy
        restart: 'no'

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
            target: production
        environment: *backend-environment
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        restart: unless-stopped

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            target: production
            args:
                VITE_API_URL: ''
        ports:
            - '${FRONTEND_PORT:-3000}:8080'
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped

volumes:
    postgres_data:
