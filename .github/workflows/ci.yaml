name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --requirement backend/requirements-dev.txt
      - run: python -m compileall -q backend
      - run: pytest -q backend/tests
      - run: docker build --file backend/Dockerfile --target test .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit --incremental false -p tsconfig.app.json
      - run: pnpm test:run
      - run: pnpm audit --audit-level moderate
      - run: pnpm build

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: finzen
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: finzen
      JWT_SECRET_KEY: ci-only-jwt-secret
      CORS_ORIGINS: http://localhost:3000
      JWT_COOKIE_SECURE: 'false'
      JWT_COOKIE_CSRF_PROTECT: 'true'
      FRONTEND_PORT: '3000'
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.yaml up --build --wait
      - run: curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/ready
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:e2e
      - if: always()
        run: docker compose -f compose.yaml logs --no-color
      - if: always()
        run: docker compose -f compose.yaml down --volumes
